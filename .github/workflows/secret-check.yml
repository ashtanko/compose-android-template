name: Secret check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: secret-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: "Reject committed secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan tracked files
        run: bash scripts/check-secrets.sh --all
